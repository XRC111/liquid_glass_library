name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze & Test (package + example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - name: Analyze package
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build-release:
    name: Build example release APK
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - name: Build example APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release
      - name: Rename APK
        run: cp example/build/app/outputs/flutter-apk/app-release.apk liquid-glass-example-${GITHUB_REF_NAME}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: liquid-glass-example-*.apk
          generate_release_notes: true
          body: |
            liquid_glass_flutter example app release APK (Android API 24-35).
